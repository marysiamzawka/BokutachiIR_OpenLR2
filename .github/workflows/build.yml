name: Build

on: [push, workflow_dispatch]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows x64"
            os: windows-2022
            build-preset: windows-vs-x64-release
            configure-preset: windows-vs-x64
            package-name: "release-x64"
          - name: "Windows x86"
            os: windows-2022
            build-preset: windows-vs-x86-release
            configure-preset: windows-vs-x86
            package-name: "release-x86"
          - name: "Ubuntu"
            os: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcpr-dev nlohmann-json3-dev
        if: startsWith(matrix.os, 'ubuntu')

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        if: startsWith(matrix.os, 'windows')

      - name: Configure
        run: cmake -B ./build --preset '${{ matrix.configure-preset }}'

      - name: Build
        run: cmake --build ./build --preset '${{ matrix.build-preset }}'

      - name: Install
        run: cmake --install ./build --config RelWithDebInfo --prefix ./build/install
        if: ${{ matrix.package-name != '' }}

      - name: Short commit hash
        id: vars
        shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        if: ${{ matrix.package-name != '' }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package-name }}-${{ steps.vars.outputs.sha_short }}
          path: build/install/bin/*
        if: ${{ matrix.package-name != '' }}
